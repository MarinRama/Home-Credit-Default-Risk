name: Tests, construction et deploiement simule

on:
  push:
    branches:
      - main
      - feature/mlops-deployment
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Tests automatises
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer OpenMP
        run: |
          sudo apt-get update
          sudo apt-get install -y libgomp1

      - name: Installer les dependances
        run: |
          python -m pip install -r requirements-api.txt -r requirements-dev.txt
          python -m pip check

      - name: Executer les tests
        run: |
          python -m pytest tests -v \
            --cov=src \
            --cov-fail-under=90 \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --junitxml=reports/tests/junit.xml

      - name: Conserver les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            coverage.xml
            htmlcov/
            reports/tests/
          retention-days: 14

  build:
    name: Construire l'image Docker
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire et identifier l'image
        run: |
          docker build \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            -t credit-scoring-api:local \
            .

      - name: Exporter l'image construite
        run: docker save credit-scoring-api:local -o image.tar

      - name: Transmettre l'image au deploiement
        uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar
          retention-days: 1

  deploy:
    name: Deployer et verifier
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Recuperer l'image construite
        uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image
        run: docker load -i image.tar

      - name: Demarrer le service
        run: docker compose up -d --no-build --wait --wait-timeout 120

      - name: Verifier le service par HTTP
        run: python -m scripts.check_deployment

      - name: Collecter les preuves
        if: always()
        run: |
          mkdir -p reports/deployment
          docker compose ps -a > reports/deployment/containers.txt
          docker compose logs --no-color > reports/deployment/api.log 2>&1
          docker image inspect credit-scoring-api:local > reports/deployment/image.json

      - name: Conserver les preuves du deploiement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-reports
          path: reports/deployment/
          retention-days: 14

      - name: Nettoyer l'environnement temporaire
        if: always()
        run: docker compose down -v